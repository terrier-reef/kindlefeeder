<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
  <title>KindleFeeder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 300px;
      background: #1a1a2e;
      color: #e0e0e0;
    }

    header {
      background: #16213e;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header .logo {
      font-size: 20px;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #e0e0e0;
    }

    header .subtitle {
      font-size: 11px;
      color: #888;
    }

    main {
      padding: 16px;
    }

    #send-btn {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #e94560;
      color: #fff;
      transition: background 0.2s, opacity 0.2s;
    }

    #send-btn:hover:not(:disabled) {
      background: #c73652;
    }

    #send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.4;
      display: none;
    }

    #status.info    { background: #0f3460; color: #90caf9; display: block; }
    #status.success { background: #1b4332; color: #74c69d; display: block; }
    #status.error   { background: #3b1212; color: #f48fb1; display: block; }
    #status.queued  { background: #2d2a00; color: #ffe082; display: block; }

    #queue-section {
      margin-top: 12px;
      padding: 10px 12px;
      background: #16213e;
      border-radius: 6px;
      font-size: 12px;
      color: #aaa;
      display: none;
    }

    #queue-section.visible { display: block; }

    #queue-section strong {
      color: #ffe082;
    }

    #calibre-warning {
      margin-top: 12px;
      padding: 10px 12px;
      background: #3b1a00;
      border-radius: 6px;
      font-size: 12px;
      color: #ffcc80;
      display: none;
    }

    #calibre-warning.visible { display: block; }

    #calibre-warning a {
      color: #ffb74d;
    }

    footer {
      padding: 10px 16px;
      border-top: 1px solid #0f3460;
      font-size: 11px;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <span class="logo">📚</span>
    <div>
      <h1>KindleFeeder</h1>
      <div class="subtitle">Send articles to your Kindle</div>
    </div>
  </header>

  <main>
    <button id="send-btn">Send to Kindle</button>
    <div id="status"></div>
    <div id="queue-section">
      <strong id="queue-count">0</strong> article(s) queued &mdash; will auto-send when Kindle is connected.
    </div>
    <div id="calibre-warning">
      Calibre is required for conversion. <a id="calibre-link" href="#" target="_blank">Download Calibre (free)</a>
    </div>
  </main>

  <footer>Kindle 3 &bull; MOBI6 format &bull; USB transfer</footer>

  <script src="popup.js"></script>
</body>
</html>
